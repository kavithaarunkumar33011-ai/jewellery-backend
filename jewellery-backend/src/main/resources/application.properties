spring.application.name=jewellery-backend

# This will use H2 on Render, Oracle on your laptop - Auto switch
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521:XE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bookdb}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bookdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:oracle.jdbc.OracleDriver}

spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.OracleDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT from Env Variables - Safe for GitHub
jwt.secret=${JWT_SECRET:secretKeyForJewelleryWebsite123456789}
jwt.expiration=86400000

server.port=${PORT:8080}