spring.application.name=jewellery-backend

# This will use H2 on Render, Oracle on your laptop - Auto switch
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:jewellerydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# JWT from Env Variables - Safe for GitHub
jwt.secret=${JWT_SECRET:secretKeyForJewelleryWebsite123456789}
jwt.expiration=86400000

server.port=${PORT:8081}